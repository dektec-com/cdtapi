#
# Everything here runs without DekTec hardware, against the emulated device; tests on a
# card are run by hand on a machine that has one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The exact version, not just the program: builds of the same major version
      # differ in what they format, and a distribution ships whichever it ships.
      - name: Install clang-format
        run: |
          python3 -m pip install --user --break-system-packages clang-format==18.1.8
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # The binding gate. The pre-commit hook runs the same script, but a contributor
      # without it installed has to be stopped here.
      - name: Coding rules
        run: Scripts/check_style.sh

  build:
    name: Build ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
          - os: ubuntu-latest
            preset: linux-release
          - os: ubuntu-latest
            preset: linux-asan
          - os: windows-latest
            preset: windows-debug
          - os: windows-latest
            preset: windows-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
